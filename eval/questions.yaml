# Genesis questions for the answer benchmark (M8).
# Each has a short gold answer, the verses that state it and the answer-key people it names.
# Drafted from the Theographic answer key and checked against the KJV text; review welcome.
# Categories:
#   single_hop   one family link
#   multi_hop    two or more links (grandparents, great-grandparents, in-laws)
#   path         how two people are related
#   memory_trap  obscure genealogy where answering from memory tends to slip
#   open         a happening or a reason, not a family link

