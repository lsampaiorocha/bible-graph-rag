[project]
name = "kgrag"
version = "0.1.0"
description = "Batch pipeline for the Bible Graph RAG project"
requires-python = ">=3.12"
dependencies = ["tiktoken>=0.14", "typer>=0.27"]

[project.scripts]
kgrag = "kgrag.cli:app"
kgrag-eval = "kgrag_eval.cli:app"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgrag", "src/kgrag_eval"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
