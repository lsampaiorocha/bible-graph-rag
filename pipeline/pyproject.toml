[project]
name = "kgrag"
version = "0.1.0"
description = "Batch pipeline for the Bible Graph RAG project"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.4",
    "networkx>=3.7",
    "numpy>=2.3",
    "pydantic>=2.13",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "sentence-transformers>=6.1",
    "tiktoken>=0.14",
    "torch>=2.14.1",
    "typer>=0.27",
]

[project.scripts]
kgrag = "kgrag.cli:app"
kgrag-eval = "kgrag_eval.cli:app"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgrag", "src/kgrag_eval"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
